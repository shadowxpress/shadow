<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shadow Xpress — Admin Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet" />
    <style>
        /* ── Reset & base ── */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #f6f8fc;
            color: #1a1a2e;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        /* ── Card ── */
        .app-wrapper {
            max-width: 1400px;
            width: 100%;
            background: #ffffff;
            border-radius: 28px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08), 0 8px 24px rgba(0, 0, 0, 0.04);
            overflow: hidden;
            transition: all 0.2s;
        }
        /* ── Header ── */
        .app-header {
            background: linear-gradient(135deg, #1a0f0a 0%, #2b0400 100%);
            padding: 20px 36px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
        }
        .app-header .brand {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .app-header .brand .logo-icon {
            width: 40px;
            height: 40px;
            background: rgba(255, 255, 255, 0.10);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 700;
            color: #f5cba0;
            letter-spacing: -0.5px;
        }
        .app-header .brand h1 {
            font-size: 22px;
            font-weight: 600;
            color: #fff;
            letter-spacing: -0.3px;
        }
        .app-header .brand h1 span {
            font-weight: 300;
            color: rgba(255, 255, 255, 0.55);
        }
        .app-header .badge {
            background: rgba(255, 255, 255, 0.08);
            padding: 6px 16px;
            border-radius: 40px;
            color: rgba(255, 255, 255, 0.75);
            font-size: 13px;
            font-weight: 400;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        .app-header .badge i {
            font-style: normal;
            margin-right: 6px;
        }

        /* ── Body ── */
        .app-body {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0;
            padding: 28px 32px 32px;
            background: #fafcff;
        }
        @media (max-width: 1024px) {
            .app-body {
                grid-template-columns: 1fr;
                gap: 28px;
                padding: 20px;
            }
        }

        /* ── Left: Form ── */
        .form-section {
            padding-right: 28px;
            border-right: 1px solid #eef2f7;
        }
        @media (max-width: 1024px) {
            .form-section {
                padding-right: 0;
                border-right: none;
            }
        }
        .form-section .section-title {
            font-size: 16px;
            font-weight: 600;
            color: #1a1a2e;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .form-section .section-sub {
            font-size: 14px;
            color: #6b7a8f;
            margin-bottom: 22px;
            border-bottom: 1px solid #eef2f7;
            padding-bottom: 14px;
        }
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px 22px;
        }
        @media (max-width: 600px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .form-group label {
            font-size: 13px;
            font-weight: 500;
            color: #2d3a4f;
            letter-spacing: 0.2px;
        }
        .form-group label .required {
            color: #c0392b;
            margin-left: 2px;
        }
        .form-group input,
        .form-group textarea {
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            padding: 10px 14px;
            border: 1.5px solid #e2e8f0;
            border-radius: 10px;
            background: #ffffff;
            transition: border 0.2s, box-shadow 0.2s;
            outline: none;
            color: #1a1a2e;
            width: 100%;
        }
        .form-group input:focus,
        .form-group textarea:focus {
            border-color: #2b0400;
            box-shadow: 0 0 0 3px rgba(43, 4, 0, 0.08);
        }
        .form-group input::placeholder,
        .form-group textarea::placeholder {
            color: #aab3c5;
        }
        .form-group textarea {
            resize: vertical;
            min-height: 44px;
        }
        .form-group .hint {
            font-size: 12px;
            color: #8a99b0;
            margin-top: 2px;
        }
        .full-width {
            grid-column: 1 / -1;
        }

        /* ── Buttons ── */
        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 28px;
            padding-top: 22px;
            border-top: 1px solid #eef2f7;
        }
        .btn {
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 500;
            padding: 11px 28px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            background: #f1f4f9;
            color: #1a1a2e;
        }
        .btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.06);
        }
        .btn:active {
            transform: translateY(0);
        }
        .btn-primary {
            background: #2b0400;
            color: #fff;
        }
        .btn-primary:hover {
            background: #3d0a04;
            box-shadow: 0 8px 24px rgba(43, 4, 0, 0.20);
        }
        .btn-secondary {
            background: #eef2f7;
            color: #1a1a2e;
        }
        .btn-secondary:hover {
            background: #e2e8f0;
        }
        .btn-success {
            background: #0e6b4c;
            color: #fff;
        }
        .btn-success:hover {
            background: #0f7d59;
            box-shadow: 0 8px 24px rgba(14, 107, 76, 0.25);
        }
        .btn-outline {
            background: transparent;
            border: 1.5px solid #d0d8e4;
            color: #1a1a2e;
        }
        .btn-outline:hover {
            background: #f1f4f9;
            border-color: #b0bcca;
        }
        .btn-danger {
            background: #b91c1c;
            color: #fff;
        }
        .btn-danger:hover {
            background: #a01515;
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }

        /* ── Right: Preview ── */
        .preview-section {
            padding-left: 28px;
            display: flex;
            flex-direction: column;
        }
        @media (max-width: 1024px) {
            .preview-section {
                padding-left: 0;
            }
        }
        .preview-section .preview-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .preview-section .preview-header .title {
            font-size: 16px;
            font-weight: 600;
            color: #1a1a2e;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .preview-section .preview-header .title .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #27ae60;
            display: inline-block;
        }
        .preview-section .preview-header .title .dot.idle {
            background: #95a5a6;
        }
        .preview-frame {
            flex: 1;
            min-height: 600px;
            border-radius: 14px;
            border: 1.5px solid #e2e8f0;
            background: #ffffff;
            overflow: hidden;
            position: relative;
        }
        .preview-frame iframe {
            width: 100%;
            height: 100%;
            min-height: 600px;
            border: none;
            background: #fff;
        }
        .preview-frame .placeholder {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            min-height: 600px;
            color: #aab3c5;
            font-size: 15px;
            text-align: center;
            padding: 40px;
            background: #fafcff;
        }
        .preview-frame .placeholder .icon {
            font-size: 48px;
            margin-bottom: 14px;
            opacity: 0.4;
        }
        .preview-frame .placeholder strong {
            color: #6b7a8f;
            font-weight: 500;
        }

        /* ── Token input (hidden by default, toggle) ── */
        .token-section {
            margin-top: 14px;
            padding: 14px 18px;
            background: #f8faff;
            border-radius: 12px;
            border: 1px dashed #d0d8e4;
            display: none;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
        }
        .token-section.visible {
            display: flex;
        }
        .token-section label {
            font-size: 13px;
            font-weight: 500;
            color: #2d3a4f;
            white-space: nowrap;
        }
        .token-section input {
            flex: 1;
            min-width: 200px;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            padding: 8px 14px;
            border: 1.5px solid #e2e8f0;
            border-radius: 8px;
            background: #fff;
            outline: none;
        }
        .token-section input:focus {
            border-color: #2b0400;
            box-shadow: 0 0 0 3px rgba(43, 4, 0, 0.06);
        }
        .token-section .btn-sm {
            font-size: 12px;
            padding: 6px 16px;
            border-radius: 8px;
            background: #2b0400;
            color: #fff;
            border: none;
            cursor: pointer;
            font-weight: 500;
            transition: 0.2s;
        }
        .token-section .btn-sm:hover {
            background: #3d0a04;
        }
        .token-section .btn-sm-outline {
            background: transparent;
            border: 1.5px solid #d0d8e4;
            color: #1a1a2e;
            font-size: 12px;
            padding: 6px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: 0.2s;
        }
        .token-section .btn-sm-outline:hover {
            background: #f1f4f9;
        }

        /* ── Toast ── */
        .toast-container {
            position: fixed;
            bottom: 30px;
            right: 30px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 9999;
            max-width: 400px;
            width: 100%;
        }
        .toast {
            background: #1a1a2e;
            color: #fff;
            padding: 16px 22px;
            border-radius: 14px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.18);
            font-size: 14px;
            animation: slideUp 0.3s ease;
            display: flex;
            align-items: center;
            gap: 12px;
            border-left: 4px solid #27ae60;
        }
        .toast.error {
            border-left-color: #e74c3c;
        }
        .toast.info {
            border-left-color: #3498db;
        }
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .toast .toast-icon {
            font-size: 20px;
        }
        .toast .toast-close {
            margin-left: auto;
            background: rgba(255, 255, 255, 0.10);
            border: none;
            color: #fff;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }
        .toast .toast-close:hover {
            background: rgba(255, 255, 255, 0.20);
        }

        /* ── Misc ── */
        .status-badge {
            font-size: 12px;
            padding: 4px 12px;
            border-radius: 40px;
            background: #eef2f7;
            color: #4a5a72;
        }
        .status-badge.ready {
            background: #e8f5e9;
            color: #1e7e34;
        }
        .flex {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .gap-4 {
            gap: 4px;
        }

        /* ── Spinner ── */
        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2.5px solid rgba(255, 255, 255, 0.20);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ── Responsive tweaks ── */
        @media (max-width: 600px) {
            .app-header {
                padding: 16px 20px;
            }
            .app-header .brand h1 {
                font-size: 17px;
            }
            .app-body {
                padding: 16px;
            }
            .actions .btn {
                flex: 1;
                justify-content: center;
            }
            .preview-frame {
                min-height: 400px;
            }
            .preview-frame iframe {
                min-height: 400px;
            }
            .preview-frame .placeholder {
                min-height: 400px;
            }
            .token-section {
                flex-direction: column;
                align-items: stretch;
            }
        }
    </style>
</head>
<body>

    <div class="app-wrapper" id="app">

        <!-- ===== HEADER ===== -->
        <header class="app-header">
            <div class="brand">
                <div class="logo-icon">✪</div>
                <h1>Shadow <span>Admin</span></h1>
            </div>
            <div class="flex">
                <span class="badge"><i>📁</i> passport-dtl</span>
                <span class="status-badge ready" id="connectionStatus">● Ready</span>
            </div>
        </header>

        <!-- ===== BODY ===== -->
        <div class="app-body">

            <!-- ─── LEFT: FORM ─── -->
            <section class="form-section">
                <div class="section-title">✎ Edit Offer Details</div>
                <div class="section-sub">Fill in the fields below, then preview &amp; upload to GitHub.</div>

                <div class="form-grid" id="formGrid">
                    <!-- Name -->
                    <div class="form-group">
                        <label>Full Name <span class="required">*</span></label>
                        <input type="text" id="f_name" value="MOHSIN RAZA" placeholder="e.g. MOHSIN RAZA" />
                    </div>
                    <!-- Passport -->
                    <div class="form-group">
                        <label>Passport No <span class="required">*</span></label>
                        <input type="text" id="f_passport" value="VH9899641" placeholder="e.g. VH9899641" />
                    </div>
                    <!-- Date -->
                    <div class="form-group">
                        <label>Date</label>
                        <input type="text" id="f_date" value="18 July, 2026" placeholder="e.g. 18 July, 2026" />
                    </div>
                    <!-- Country -->
                    <div class="form-group">
                        <label>Country</label>
                        <input type="text" id="f_country" value="Pakistan" placeholder="e.g. Pakistan" />
                    </div>
                    <!-- Job Profile -->
                    <div class="form-group">
                        <label>Job Profile <span class="required">*</span></label>
                        <input type="text" id="f_job" value="MECHANIC" placeholder="e.g. MECHANIC" />
                    </div>
                    <!-- Salary -->
                    <div class="form-group">
                        <label>Salary (USD)</label>
                        <input type="text" id="f_salary" value="3500" placeholder="e.g. 3500" />
                    </div>
                    <!-- Working Hours -->
                    <div class="form-group full-width">
                        <label>Working Hours</label>
                        <input type="text" id="f_hours" value="48 Hours in a week, 6 days in a week." placeholder="e.g. 48 Hours in a week, 6 days in a week." />
                    </div>
                    <!-- Probation -->
                    <div class="form-group">
                        <label>Probation Period</label>
                        <input type="text" id="f_probation" value="60 Days" placeholder="e.g. 60 Days" />
                    </div>
                    <!-- Contract -->
                    <div class="form-group">
                        <label>Contract Period</label>
                        <input type="text" id="f_contract" value="Two Years" placeholder="e.g. Two Years" />
                    </div>
                    <!-- Accommodation -->
                    <div class="form-group full-width">
                        <label>Accommodation</label>
                        <input type="text" id="f_accommodation" value="(Quad Sharing Rooms) – Two (2)" placeholder="e.g. (Quad Sharing Rooms) – Two (2)" />
                    </div>
                    <!-- Invoice -->
                    <div class="form-group">
                        <label>Invoice No</label>
                        <input type="text" id="f_invoice" value="GJ316940" placeholder="e.g. GJ316940" />
                    </div>
                    <!-- Photo URL -->
                    <div class="form-group">
                        <label>Photo URL (optional)</label>
                        <input type="text" id="f_photo" value="" placeholder="https://example.com/photo.jpg" />
                        <span class="hint">Direct image URL for the applicant photo</span>
                    </div>
                </div>

                <!-- Actions -->
                <div class="actions">
                    <button class="btn btn-primary" id="btnPreview">👁️ Preview</button>
                    <button class="btn btn-success" id="btnUpload">⬆ Upload to GitHub</button>
                    <button class="btn btn-secondary" id="btnDownload">⬇ Download HTML</button>
                    <button class="btn btn-outline" id="btnToggleToken">🔑 Token</button>
                    <button class="btn btn-outline" id="btnReset">↺ Reset</button>
                </div>

                <!-- Token section (hidden by default) -->
                <div class="token-section" id="tokenSection">
                    <label>GitHub Token</label>
                    <input type="password" id="githubToken" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx" />
                    <button class="btn-sm" id="btnSaveToken">Save</button>
                    <button class="btn-sm-outline" id="btnClearToken">Clear</button>
                    <span style="font-size:12px;color:#8a99b0;margin-left:auto;">needs <strong>repo</strong> scope</span>
                </div>
            </section>

            <!-- ─── RIGHT: PREVIEW ─── -->
            <section class="preview-section">
                <div class="preview-header">
                    <div class="title">
                        <span class="dot idle" id="previewDot"></span>
                        Live Preview
                    </div>
                    <div>
                        <span class="status-badge" id="fileStatus">not generated</span>
                    </div>
                </div>
                <div class="preview-frame" id="previewFrame">
                    <div class="placeholder" id="placeholder">
                        <div class="icon">📄</div>
                        <div>
                            <strong>No document generated yet</strong><br />
                            Fill in the form and click <strong>“Preview”</strong>
                        </div>
                    </div>
                    <iframe id="previewIframe" style="display:none;"></iframe>
                </div>
            </section>

        </div>
    </div>

    <!-- ===== TOAST CONTAINER ===== -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- ============================================================ -->
    <!-- ===== JAVASCRIPT ===== -->
    <script>
        (function() {
            'use strict';

            // ── DOM refs ──
            const $ = (id) => document.getElementById(id);
            const f_name = $('f_name'),
                f_passport = $('f_passport'),
                f_date = $('f_date'),
                f_country = $('f_country'),
                f_job = $('f_job'),
                f_salary = $('f_salary'),
                f_hours = $('f_hours'),
                f_probation = $('f_probation'),
                f_contract = $('f_contract'),
                f_accommodation = $('f_accommodation'),
                f_invoice = $('f_invoice'),
                f_photo = $('f_photo');

            const btnPreview = $('btnPreview'),
                btnUpload = $('btnUpload'),
                btnDownload = $('btnDownload'),
                btnToggleToken = $('btnToggleToken'),
                btnReset = $('btnReset');
            const tokenSection = $('tokenSection'),
                githubToken = $('githubToken'),
                btnSaveToken = $('btnSaveToken'),
                btnClearToken = $('btnClearToken');
            const previewIframe = $('previewIframe'),
                placeholder = $('placeholder'),
                previewDot = $('previewDot'),
                fileStatus = $('fileStatus'),
                connectionStatus = $('connectionStatus');

            const toastContainer = $('toastContainer');

            // ── State ──
            let currentHtml = '';
            let currentFilename = '';
            let isUploading = false;

            // ── Load token from localStorage ──
            (function loadToken() {
                const saved = localStorage.getItem('gh_token');
                if (saved) {
                    githubToken.value = saved;
                    tokenSection.classList.add('visible');
                }
            })();

            // ── Toast system ──
            function showToast(message, type = 'success', duration = 4500) {
                const icons = { success: '✅', error: '❌', info: 'ℹ️' };
                const toast = document.createElement('div');
                toast.className = `toast ${type}`;
                toast.innerHTML = `
                    <span class="toast-icon">${icons[type] || 'ℹ️'}</span>
                    <span>${message}</span>
                    <button class="toast-close" aria-label="Close">✕</button>
                `;
                toastContainer.appendChild(toast);
                const closeBtn = toast.querySelector('.toast-close');
                closeBtn.addEventListener('click', () => toast.remove());
                setTimeout(() => {
                    if (toast.parentNode) toast.remove();
                }, duration);
            }

            // ── Get all form data ──
            function getFormData() {
                return {
                    name: f_name.value.trim() || 'MOHSIN RAZA',
                    passport: f_passport.value.trim() || 'VH9899641',
                    date: f_date.value.trim() || '18 July, 2026',
                    country: f_country.value.trim() || 'Pakistan',
                    job: f_job.value.trim() || 'MECHANIC',
                    salary: f_salary.value.trim() || '3500',
                    hours: f_hours.value.trim() || '48 Hours in a week, 6 days in a week.',
                    probation: f_probation.value.trim() || '60 Days',
                    contract: f_contract.value.trim() || 'Two Years',
                    accommodation: f_accommodation.value.trim() || '(Quad Sharing Rooms) – Two (2)',
                    invoice: f_invoice.value.trim() || 'GJ316940',
                    photo_url: f_photo.value.trim() || '',
                };
            }

            // ── Build the full HTML document ──
            function buildHtml(data) {
                // photo HTML
                let photoHtml = '<div class="photo-placeholder">No photo added</div>';
                if (data.photo_url) {
                    photoHtml =
                        `<img src="${data.photo_url}" alt="Applicant Photo" class="photo-preview" onerror="this.outerHTML='<div class=photo-placeholder>Invalid image URL</div>'">`;
                }

                // Use a template literal — we embed the whole HTML exactly as in the Python script
                // but with ${...} placeholders.
                return `<!DOCTYPE html>
        <html lang="en">
        <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Job Offer - ${data.name}</title>
            <link href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
            <style>
                * { margin: 0; padding: 0; box-sizing: border-box; }
                body { font-family: 'Inter', sans-serif; background: #f0f2f5; padding: 20px; color: #000; }

            // ── Generate and show preview ──
            function generatePreview() {
                const data = getFormData();
                if (!data.name) {
                    showToast('Please enter the Full Name.', 'error');
                    return;
                }
                currentHtml = buildHtml(data);
                currentFilename = `${data.name.replace(/\s+/g, '_').replace(/[^a-zA-Z0-9_-]/g, '')}_Job_Offer.html`;

                // Show in iframe
                previewIframe.style.display = 'block';
                placeholder.style.display = 'none';
                const blob = new Blob([currentHtml], { type: 'text/html' });
                const url = URL.createObjectURL(blob);
                previewIframe.src = url;

                // Update status
                previewDot.className = 'dot';
                fileStatus.textContent = `✅ ${currentFilename}`;
                showToast(`Preview ready: ${currentFilename}`, 'success', 3000);
            }

            // ── Download HTML ──
            function downloadHtml() {
                if (!currentHtml) {
                    showToast('Please generate a preview first.', 'error');
                    return;
                }
                const blob = new Blob([currentHtml], { type: 'text/html;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = currentFilename || 'Job_Offer.html';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                showToast(`Downloaded: ${currentFilename}`, 'success');
            }

            // ── Upload to GitHub ──
            async function uploadToGitHub() {
                if (isUploading) return;
                if (!currentHtml) {
                    showToast('Please generate a preview first.', 'error');
                    return;
                }

                const token = githubToken.value.trim() || localStorage.getItem('gh_token');
                if (!token) {
                    showToast('Please enter a GitHub Personal Access Token (repo scope).', 'error');
                    tokenSection.classList.add('visible');
                    return;
                }

                // GitHub repo info
                const owner = 'shadowxpress';
                const repo = 'shadow';
                const branch = 'main';
                const path = `passport-dtl/${currentFilename}`;
                const apiUrl = `https://api.github.com/repos/${owner}/${repo}/contents/${path}`;

                isUploading = true;
                btnUpload.disabled = true;
                btnUpload.innerHTML = '<span class="spinner"></span> Uploading...';
                connectionStatus.textContent = '⏳ Uploading...';

                try {
                    // 1. Get the current file SHA if it exists
                    let sha = null;
                    try {
                        const getRes = await fetch(apiUrl, {
                            headers: {
                                'Authorization': `token ${token}`,
                                'Accept': 'application/vnd.github.v3+json',
                            }
                        });
                        if (getRes.ok) {
                            const data = await getRes.json();
                            sha = data.sha;
                        }
                    } catch (_) { /* file doesn't exist */ }

                    // 2. Encode content as base64
                    const encoded = btoa(unescape(encodeURIComponent(currentHtml)));

                    // 3. Build the payload
                    const payload = {
                        message: `Add/update job offer: ${currentFilename}`,
                        content: encoded,
                        branch: branch,
                    };
                    if (sha) payload.sha = sha;

                    // 4. PUT request
                    const putRes = await fetch(apiUrl, {
                        method: 'PUT',
                        headers: {
                            'Authorization': `token ${token}`,
                            'Accept': 'application/vnd.github.v3+json',
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify(payload),
                    });

                    const result = await putRes.json();

                    if (putRes.ok) {
                        const htmlUrl = result.content?.html_url || `https://github.com/${owner}/${repo}/blob/${branch}/${path}`;
                        showToast(`✅ Uploaded successfully! ${currentFilename}`, 'success', 5000);
                        connectionStatus.textContent = '✅ Uploaded';
                        fileStatus.textContent = `☁️ ${currentFilename}`;
                        // Open in new tab?
                        if (confirm(`✅ Uploaded!\n\nOpen the file on GitHub?`)) {
                            window.open(htmlUrl, '_blank');
                        }
                    } else {
                        throw new Error(result.message || 'Upload failed');
                    }
                } catch (err) {
                    console.error(err);
                    showToast(`❌ Upload failed: ${err.message}`, 'error', 6000);
                    connectionStatus.textContent = '❌ Error';
                } finally {
                    isUploading = false;
                    btnUpload.disabled = false;
                    btnUpload.innerHTML = '⬆ Upload to GitHub';
                    setTimeout(() => {
                        if (connectionStatus.textContent === '⏳ Uploading...' || connectionStatus.textContent === '❌ Error') {
                            connectionStatus.textContent = '● Ready';
                        }
                    }, 3000);
                }
            }

            // ── Reset form to defaults ──
            function resetForm() {
                f_name.value = 'MOHSIN RAZA';
                f_passport.value = 'VH9899641';
                f_date.value = '18 July, 2026';

                f_probation.value = '60 Days';

                f_invoice.value = 'GJ316940';

                // Reset preview
                previewIframe.style.display = 'none';
                placeholder.style.display = 'flex';
                previewDot.className = 'dot idle';
                fileStatus.textContent = 'not generated';
                currentHtml = '';
                currentFilename = '';
                showToast('Form reset to defaults', 'info');
            }

            // ── Token helpers ──
            function saveToken() {
                const val = githubToken.value.trim();
                if (val) {
                    localStorage.setItem('gh_token', val);
                    showToast('Token saved securely (localStorage)', 'success');
                } else {
                    localStorage.removeItem('gh_token');
                    showToast('Token cleared', 'info');
                }
            }

            function clearToken() {
                githubToken.value = '';
                localStorage.removeItem('gh_token');
                showToast('Token removed', 'info');
            }

            function toggleTokenSection() {
                tokenSection.classList.toggle('visible');
                if (tokenSection.classList.contains('visible')) {
                    githubToken.focus();
                }
            }

            // ── Event bindings ──
            btnPreview.addEventListener('click', generatePreview);
            btnDownload.addEventListener('click', downloadHtml);
            btnUpload.addEventListener('click', uploadToGitHub);
            btnReset.addEventListener('click', resetForm);
            btnToggleToken.addEventListener('click', toggleTokenSection);
            btnSaveToken.addEventListener('click', saveToken);
            btnClearToken.addEventListener('click', clearToken);

            // Enter key on token input saves
            githubToken.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') saveToken();
            });

            // Click on placeholder to trigger preview
            placeholder.addEventListener('click', generatePreview);

            // Auto-preview on Ctrl+Enter
            document.addEventListener('keydown', (e) => {
                if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                    e.preventDefault();
                    generatePreview();
                }
            });

            // ── Initial state ──
            // Generate a preview on load so the user sees something
            setTimeout(() => {
                generatePreview();
            }, 300);

            console.log('🚀 Shadow Admin ready.');
            console.log('📁 Repo: shadowxpress/shadow/passport-dtl');
            console.log('💡 Use Ctrl+Enter to preview.');

        })();
    </script>
